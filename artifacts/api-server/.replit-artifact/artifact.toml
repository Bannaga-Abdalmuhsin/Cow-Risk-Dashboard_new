kind = "web"
previewPath = "/api/"
title = "API Server"
version = "1.0.0"
id = "artifacts/api-server"
router = "path"

[[services]]
name = "api"
paths = ["/api"]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = ["sh", "-c", "pnpm --filter @workspace/hajj-dashboard run build && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build"]
run = "pnpm --filter @workspace/api-server run start"

[services.env]
PORT = "8080"
NODE_ENV = "production"
