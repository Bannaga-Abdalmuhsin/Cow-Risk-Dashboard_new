kind = "web"
previewPath = "/"
title = "Hajj Telecom COW Risk Dashboard"
version = "1.0.0"
id = "artifacts/hajj-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21597

[services.development]
run = "pnpm --filter @workspace/hajj-dashboard run dev"

[services.production]
build = ["sh", "-c", "pnpm --filter @workspace/hajj-dashboard run build && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build"]
run = "pnpm --filter @workspace/api-server run start"

[services.env]
PORT = "21597"
BASE_PATH = "/"
NODE_ENV = "production"
